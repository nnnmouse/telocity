[*]
version = 1

load-mode = mlock
fit = off
n-gpu-layers = all
kv-unified = true
flash-attn = on
threads = 6
repeat-penalty = 1.0
min-p = 0.0
reasoning-preserve = false
reasoning-format = deepseek
sleep-idle-seconds = 600
jinja = on


[index2b]
model = /path/to/models/Index-Translate-2B.Q8_0.gguf
mmproj = /path/to/models/Index-Translate-2B.mmproj-f16.gguf
parallel = 4
ctx-size = 65536
spec-type = draft-mtp
spec-draft-n-max = 2
spec-draft-ngl = all
image-min-tokens = 1024
image-max-tokens = 1024
cache-ram = 0
ctx-checkpoints = 0
temp = 0
top-k = 20
top-p = 0.8
reasoning = off

